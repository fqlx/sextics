name: Cycle-q2 proper-specialization leaf
on:
  push:
    branches: [fqlx/q2-proper-specialization-20261115]
permissions:
  contents: read
concurrency:
  group: q2-proper-specialization-leaf
  cancel-in-progress: false
jobs:
  bounded:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check immutable target and pinned dependencies
        run: |
          mkdir -p leaf-receipt
          git rev-parse HEAD | tee leaf-receipt/commit.txt
          test "$(git hash-object data/cycle-q2/Solution.lean)" = 3422e79fc263c2b098c61ce9a9577e303aefc009
          test "$(cat formal/lean/lean-toolchain)" = leanprover/lean4:v4.33.1
          python3 - <<'PY'
          import json
          m = json.load(open('formal/lean/lake-manifest.json'))
          assert next(x['rev'] for x in m['packages'] if x['name'] == 'mathlib') == '0df444a360eaa60ab8c11dca51a86af692955474'
          PY
      - name: Install official Lean launcher
        run: |
          curl --fail --location --connect-timeout 15 --max-time 60 https://raw.githubusercontent.com/leanprover/elan/v4.2.0/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            formal/lean/.lake/packages
            ~/.elan/toolchains
          key: q2-specialization-deps-v1-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain','formal/lean/lake-manifest.json','formal/lean/lakefile.toml') }}
      - name: Fetch only the official proper-morphism dependency cache
        id: mathlib
        working-directory: formal/lean
        run: |
          set -euo pipefail
          lake env lean --version | tee ../../leaf-receipt/lean-version.txt
          timeout --signal=TERM --kill-after=5s 420s lake exe cache get Mathlib.AlgebraicGeometry.Morphisms.Proper 2>&1 | tee ../../leaf-receipt/cache.log
      - name: Compile exactly one new module
        working-directory: formal/lean
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,signal,subprocess,time
          root=pathlib.Path.cwd(); receipt=root.parent.parent/'leaf-receipt'
          name='GeometricProperParameterSpecialization'
          source=root.parent.parent/'data/cycle-q2'/f'{name}.lean'
          dst=root/'Proposal'/f'{name}.lean'; dst.parent.mkdir(exist_ok=True); dst.write_bytes(source.read_bytes())
          obj=root/'.lake/build/lib/lean/Proposal'/f'{name}.olean'; obj.parent.mkdir(parents=True,exist_ok=True)
          cmd=['lake','env','lean','-j1','-M4096','-DmaxHeartbeats=0','-o',str(obj.relative_to(root)),str(dst.relative_to(root))]
          start=time.monotonic(); peak=0; stop=None
          def memory(pgid):
              rss=0
              for p in pathlib.Path('/proc').iterdir():
                  if not p.name.isdigit(): continue
                  try:
                      if os.getpgid(int(p.name))!=pgid: continue
                      for line in (p/'status').read_text().splitlines():
                          if line.startswith('VmRSS:'): rss+=int(line.split()[1])
                  except (OSError,ValueError): pass
              avail=next(int(l.split()[1]) for l in pathlib.Path('/proc/meminfo').read_text().splitlines() if l.startswith('MemAvailable:'))
              return rss,avail
          with (receipt/'compile.log').open('w') as log:
              log.write('COMMAND: '+' '.join(cmd)+'\n');log.flush()
              p=subprocess.Popen(cmd,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              try:
                  while p.poll() is None:
                      rss,avail=memory(p.pid);peak=max(peak,rss)
                      if rss>6144*1024: stop='RSS limit'
                      elif avail<1536*1024: stop='available-memory reserve'
                      elif time.monotonic()-start>90: stop='90-second module deadline'
                      if stop: os.killpg(p.pid,signal.SIGKILL);break
                      time.sleep(.1)
              finally:
                  if p.poll() is None: os.killpg(p.pid,signal.SIGKILL)
                  p.wait()
          text=(receipt/'compile.log').read_text();print(text)
          data={'module':name,'source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'returncode':p.returncode,'seconds':round(time.monotonic()-start,3),'peak_group_rss_kib':peak,'stop':stop,'object_exists':obj.exists(),'kernel_replay':False,'protected_acceptance':False,'command':cmd}
          if obj.exists():data['object_sha256']=hashlib.sha256(obj.read_bytes()).hexdigest()
          (receipt/'result.json').write_text(json.dumps(data,indent=2)+'\n')
          assert p.returncode==0 and obj.exists() and stop is None and 'sorryAx' not in text,data
          PY
      - name: Preserve exact source, object and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-specialization-leaf-${{ github.run_id }}
          path: |
            leaf-receipt
            data/cycle-q2/GeometricProperParameterSpecialization.lean
            formal/lean/.lake/build/lib/lean/Proposal
          include-hidden-files: true
          retention-days: 30
      - name: Preserve pinned dependency cache
        if: always() && steps.mathlib.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            formal/lean/.lake/packages
            ~/.elan/toolchains
          key: q2-specialization-deps-v1-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain','formal/lean/lake-manifest.json','formal/lean/lakefile.toml') }}
