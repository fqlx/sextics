name: Cycle q2 development Lean check

on:
  push:
    branches: [cycle-q2-proof-check-20261111]

permissions:
  contents: read

concurrency:
  group: cycle-q2-development
  cancel-in-progress: true

jobs:
  lean:
    name: Development compile, kernel replay, and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install Python support
        run: python3 -m pip install PyYAML
      - name: Install pinned Lean toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.2.0/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            formal/lean/.lake
            ~/.elan/toolchains
          key: cycle-q2-development-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lake-manifest.json') }}
      - name: Prepare exact dependencies
        working-directory: formal/lean
        run: |
          lake exe cache get
          lake build HodgeComputer.Verify Mathlib.Data.Matrix.Mul Mathlib.Tactic
      - name: Compile active proof and replay kernel
        run: python3 tools/cycle-q2-development/check.py
      - name: Upload development receipts, not an acceptance record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cycle-q2-development-${{ github.sha }}
          path: development-receipts/
          retention-days: 7
