name: Cycle-q2 bounded assembly compilation

on:
  push:
    branches: [fqlx/cycle-q2-bounded-compile-d2e3431-20261115]

permissions:
  contents: read

concurrency:
  group: cycle-q2-bounded-compile-d2e3431
  cancel-in-progress: false

jobs:
  bounded:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Record source and immutable target
        run: |
          mkdir -p compile-receipt
          git rev-parse HEAD | tee compile-receipt/check-commit.txt
          printf '%s\n' d2e3431d12feaed2c812cea76ced186f77772cb7 > compile-receipt/assembly-base.txt
          git hash-object data/cycle-q2/Solution.lean | tee compile-receipt/protected-solution-blob.txt
          test "$(cat compile-receipt/protected-solution-blob.txt)" = 3422e79fc263c2b098c61ce9a9577e303aefc009
          cat formal/lean/lean-toolchain | tee compile-receipt/lean-toolchain.txt
          test "$(cat formal/lean/lean-toolchain)" = leanprover/lean4:v4.33.1
          python3 - <<'PY'
          import json
          m = json.load(open('formal/lean/lake-manifest.json'))
          p = next(p for p in m['packages'] if p['name'] == 'mathlib')
          assert p['rev'] == '0df444a360eaa60ab8c11dca51a86af692955474', p
          PY
      - name: Install official Lean launcher
        run: |
          set -euo pipefail
          curl --fail --location --connect-timeout 15 --max-time 60 https://raw.githubusercontent.com/leanprover/elan/v4.2.0/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned dependencies only
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            formal/lean/.lake/packages
            ~/.elan/toolchains
          key: repository-lean-dependencies-v2-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lake-manifest.json', 'formal/lean/lakefile.toml') }}
      - name: Fetch official Mathlib cache for independent imports
        id: mathlib
        timeout-minutes: 8
        working-directory: formal/lean
        run: |
          set -euo pipefail
          lake env lean --version | tee ../../compile-receipt/lean-version.txt
          timeout --signal=TERM --kill-after=5s 420s lake exe cache get Mathlib.RingTheory.MvPolynomial.WeightedHomogeneous Mathlib.Tactic Mathlib.RingTheory.Ideal.Operations Mathlib.Algebra.Module.Submodule.Equiv 2>&1 | tee ../../compile-receipt/cache.log
      - name: Compile sequentially; never rebuild missing proposal imports
        working-directory: formal/lean
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, resource, signal, subprocess, sys, time
          root = pathlib.Path.cwd()
          receipt = root.parent.parent / 'compile-receipt'
          source = root.parent.parent / 'data' / 'cycle-q2'
          proposal = root / 'Proposal'
          objects = root / '.lake/build/lib/lean/Proposal'
          proposal.mkdir(exist_ok=True)
          objects.mkdir(parents=True, exist_ok=True)
          core = pathlib.Path.home() / '.elan/toolchains/leanprover--lean4---v4.33.1/lib/lean/Lean/Elab/Binders.ir'
          diagnostic = {'core_ir': str(core), 'exists': core.exists(), 'virtual_memory_cap': None, 'resident_group_limit_mib': 4608, 'available_memory_reserve_mib': 1536}
          if core.exists():
              diagnostic['size'] = core.stat().st_size
              with core.open('rb') as f:
                  diagnostic['first_32_bytes'] = f.read(32).hex()
          print(json.dumps(diagnostic), flush=True)
          (receipt / 'runtime-preflight.json').write_text(json.dumps(diagnostic, indent=2) + '\n')
          modules = ['GeometricSectionDegreeGap', 'GeometricSectionInverseIdeal', 'GeometricEmptySectionRows', 'GeometricSeedSectionInverse', 'GeometricSeedConeSection', 'GeometricSeedSectionNonempty', 'GeometricFirstOrderNonemptyFlatCurve']
          for name in modules:
              (proposal / (name + '.lean')).write_bytes((source / (name + '.lean')).read_bytes())
          env = dict(os.environ)
          env['LEAN_PATH'] = str(objects.parent) + (os.pathsep + env['LEAN_PATH'] if env.get('LEAN_PATH') else '')
          results = []
          def limits():
              resource.setrlimit(resource.RLIMIT_CPU, (85, 90))
          def memory(pgid):
              rss = 0
              for entry in pathlib.Path('/proc').iterdir():
                  if not entry.name.isdigit():
                      continue
                  try:
                      if os.getpgid(int(entry.name)) != pgid:
                          continue
                      for line in (entry / 'status').read_text().splitlines():
                          if line.startswith('VmRSS:'):
                              rss += int(line.split()[1])
                  except (OSError, ValueError):
                      continue
              available = next(int(line.split()[1]) for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:'))
              return rss, available
          for name in modules:
              obj = objects / (name + '.olean')
              obj.unlink(missing_ok=True)
              cmd = ['lake', 'env', 'lean', '-j1', '-M3072', '-o', str(obj.relative_to(root)), 'Proposal/' + name + '.lean']
              start = time.monotonic()
              peak = 0
              stop = None
              with (receipt / (name + '.log')).open('w') as log:
                  log.write('COMMAND: ' + ' '.join(cmd) + '\n'); log.flush()
                  p = subprocess.Popen(cmd, env=env, stdout=log, stderr=subprocess.STDOUT, start_new_session=True, preexec_fn=limits)
                  while p.poll() is None:
                      rss, available = memory(p.pid)
                      peak = max(peak, rss)
                      if rss > 4608 * 1024:
                          stop = 'resident-memory limit'
                      elif available < 1536 * 1024:
                          stop = 'available-memory reserve'
                      elif time.monotonic() - start > 90:
                          stop = '90-second wall deadline'
                      if stop:
                          try:
                              os.killpg(p.pid, signal.SIGKILL)
                          except ProcessLookupError:
                              pass
                          p.wait()
                          log.write('\nSTOP: ' + stop + '\n')
                          break
                      time.sleep(0.1)
                  code = 124 if stop else p.wait()
              print((receipt / (name + '.log')).read_text(), flush=True)
              row = {'module': name, 'source_sha256': hashlib.sha256((proposal / (name + '.lean')).read_bytes()).hexdigest(), 'returncode': code, 'seconds': round(time.monotonic()-start, 3), 'peak_group_rss_kib': peak, 'guard_stop': stop, 'object_exists': obj.exists()}
              results.append(row)
              (receipt / 'results.json').write_text(json.dumps({'scope': 'bounded source compilation only; not protected acceptance or independent kernel replay', 'results': results, 'not_attempted': modules[len(results):]}, indent=2) + '\n')
              if code != 0:
                  print('Stopped at first compiler, import, or resource failure. No full build was started.', flush=True)
                  sys.exit(1)
              if not obj.exists():
                  sys.exit('Compiler reported success without the requested object')
          PY
      - name: Preserve exact logs and compiled leaf objects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cycle-q2-bounded-compile-${{ github.run_id }}
          path: |
            compile-receipt
            formal/lean/.lake/build/lib/lean/Proposal
          include-hidden-files: true
          retention-days: 7
      - name: Preserve pinned dependencies without proposal objects
        if: always() && steps.mathlib.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            formal/lean/.lake/packages
            ~/.elan/toolchains
          key: repository-lean-dependencies-v2-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lake-manifest.json', 'formal/lean/lakefile.toml') }}
