name: Cycle-q2 bounded dependency compilation

on:
  push:
    branches: [fqlx/cycle-q2-bounded-compile-d2e3431-20261115]

permissions:
  contents: read

concurrency:
  group: cycle-q2-bounded-compile-d2e3431
  cancel-in-progress: false

jobs:
  bounded:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Retain bounded runner outside source checkout
        run: cp .ci/q2_bounded_dependencies.py "$RUNNER_TEMP/q2_bounded_dependencies.py"
      - name: Check out immutable current proof source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2ec547c6da661aeb281db6ed4775ba38336b47f3
          persist-credentials: false
          fetch-depth: 1
      - name: Record protected source and exact pins
        run: |
          set -euo pipefail
          mkdir -p compile-receipt
          git rev-parse HEAD | tee compile-receipt/source-commit.txt
          printf '%s\n' '${{ github.sha }}' > compile-receipt/runner-commit.txt
          git hash-object data/cycle-q2/Solution.lean | tee compile-receipt/protected-solution-blob.txt
          test "$(cat compile-receipt/protected-solution-blob.txt)" = 3422e79fc263c2b098c61ce9a9577e303aefc009
          test "$(cat formal/lean/lean-toolchain)" = leanprover/lean4:v4.33.1
          python3 - <<'PY'
          import json
          p = next(p for p in json.load(open('formal/lean/lake-manifest.json'))['packages'] if p['name']=='mathlib')
          assert p['rev']=='0df444a360eaa60ab8c11dca51a86af692955474'
          PY
          python3 -m pip install 'PyYAML==6.0.2'
          cp "$RUNNER_TEMP/q2_bounded_dependencies.py" compile-receipt/runner.py
          python3 "$RUNNER_TEMP/q2_bounded_dependencies.py" plan
      - name: Install official Lean launcher
        run: |
          set -euo pipefail
          curl --fail --location --connect-timeout 15 --max-time 60 https://raw.githubusercontent.com/leanprover/elan/v4.2.0/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            formal/lean/.lake/packages
            ~/.elan/toolchains
          key: repository-lean-dependencies-v2-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lake-manifest.json', 'formal/lean/lakefile.toml') }}
      - name: Fetch official cache for required Mathlib imports
        id: mathlib
        timeout-minutes: 8
        working-directory: formal/lean
        run: |
          set -euo pipefail
          lake env lean --version | tee ../../compile-receipt/lean-version.txt
          timeout --signal=TERM --kill-after=5s 420s xargs lake exe cache get < ../../compile-receipt/mathlib-roots.txt 2>&1 | tee ../../compile-receipt/cache.log
      - name: Restore source-keyed proposal objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: q2-object-cache
          key: q2-deps-v1-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            q2-deps-v1-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lake-manifest.json') }}-
      - name: Compile required dependencies sequentially with checkpoints
        env:
          Q2_BATCH_SECONDS: 420
          Q2_BATCH_MODULES: 60
          Q2_MODULE_SECONDS: 90
        run: python3 "$RUNNER_TEMP/q2_bounded_dependencies.py" compile
      - name: Preserve successful objects even when a later module fails
        if: always() && hashFiles('q2-object-cache/manifest.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: q2-object-cache
          key: q2-deps-v1-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lake-manifest.json') }}-${{ github.run_id }}
      - name: Preserve logs, dependency graph, and reusable objects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cycle-q2-dependencies-${{ github.run_id }}
          path: |
            compile-receipt
            q2-object-cache
          include-hidden-files: true
          retention-days: 30
